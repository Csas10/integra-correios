name: quality-gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: integra_correios_test
          POSTGRES_USER: integra_test
          POSTGRES_PASSWORD: integra_test_ephemeral
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U integra_test -d integra_correios_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://integra_test:integra_test_ephemeral@localhost:5432/integra_correios_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Repository policy
        run: npm run policy:repo

      - name: Secret scan
        # Snapshot atual + todos os commits introduzidos pela PR/push.
        env:
          SECURITY_SCAN_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          SECURITY_SCAN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run security:secrets

      - name: PII scan
        # Mesmo intervalo completo do secret scan; nunca somente HEAD^.
        env:
          SECURITY_SCAN_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          SECURITY_SCAN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run security:pii

      - name: Typecheck
        run: npm run typecheck

      - name: PostgreSQL migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/0001_operational_persistence.sql

      - name: PostgreSQL runtime roles migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/0002_runtime_roles.sql

      - name: PostgreSQL batch mode migration (DRY_RUN/LIVE_PILOT)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/0003_batch_mode_dry_run.sql

      - name: PostgreSQL OAuth binding migration (F18 — one-time cross-instance)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/0004_oauth_flow.sql

      - name: PostgreSQL runtime role fail-closed regressions
        shell: bash
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE integra_runtime INHERIT"
          if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/0002_runtime_roles.sql; then
            echo "migration accepted integra_runtime with INHERIT" >&2
            exit 1
          fi
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE integra_runtime NOINHERIT"

          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE integra_runtime_parent_test NOLOGIN"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "GRANT integra_runtime_parent_test TO integra_runtime"
          if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/0002_runtime_roles.sql; then
            echo "migration accepted integra_runtime as member of another role" >&2
            exit 1
          fi
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "REVOKE integra_runtime_parent_test FROM integra_runtime"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DROP ROLE integra_runtime_parent_test"

          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/0002_runtime_roles.sql

      - name: Tests
        run: npm test

      - name: PostgreSQL constraints
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/tests/0001_operational_persistence.test.sql

      - name: PostgreSQL runtime roles
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/tests/0002_runtime_roles.test.sql

      - name: Build
        run: npm run build

      - name: Build web application
        run: npm run build:web

      - name: Git whitespace check
        # Vendor de terceiros (SheetJS) preserva o whitespace original do
        # fornecedor. Em PRs, os SHAs do evento cobrem toda a diferença
        # base...head, inclusive quando a branch contém vários commits.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA" -- . ':(exclude)vendor/**'
